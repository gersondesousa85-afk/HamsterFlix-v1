<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HamsterFlix</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="splash" class="splash" aria-live="polite">
    <div class="glass panel">
      <h1>HamsterFlix</h1>
      <p id="splashText">Iniciando...</p>
    </div>
  </div>

  <header class="top glass">
    <button id="searchBtn" class="icon" aria-label="Busca global">⌕</button>
    <div>
      <h1>HamsterFlix</h1>
      <p id="serverLabel">Servidor: --</p>
    </div>
    <button id="settingsBtn" class="icon" aria-label="Configurações">⚙</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="bottom glass" aria-label="Navegação inferior">
    <button data-route="home" class="nav active">Home</button>
    <button data-route="movies" class="nav">Filmes</button>
    <button data-route="series" class="nav">Séries</button>
    <button data-route="tv" class="nav">TV</button>
    <button data-route="history" class="nav">Histórico</button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="./app.js"></script>
</body>
</html>
