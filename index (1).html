<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HamsterFlix</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app">
    <div id="splash" class="splash active" aria-live="polite">
      <div class="glass splash-card">
        <h1>HamsterFlix</h1>
        <p>Carregando melhor servidor...</p>
      </div>
    </div>

    <header class="topbar glass" role="banner">
      <button id="openSearchBtn" class="icon-btn" aria-label="Abrir busca">⌕</button>
      <div>
        <h1 class="brand">HamsterFlix</h1>
        <p id="activeServerLabel" class="muted">Servidor: --</p>
      </div>
      <button id="openSettingsBtn" class="icon-btn" aria-label="Abrir configurações">⚙</button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="bottom-nav glass" aria-label="Navegação principal">
      <button data-route="home" class="nav-item active">Home</button>
      <button data-route="movies" class="nav-item">Filmes</button>
      <button data-route="series" class="nav-item">Séries</button>
      <button data-route="tv" class="nav-item">TV</button>
      <button data-route="history" class="nav-item">Histórico</button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
